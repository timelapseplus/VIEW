<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Font configuration for the VIEW UI process (FONTCONFIG_FILE in start.sh / restart_ui.sh).

  The UI renders OLED text through pitft, but the pango/cairo/fontconfig actually loaded are the
  copies bundled with sharp (node_modules/sharp/lib, loaded first by image.js). That fontconfig was
  cross-built with a config path of /target/etc/fonts, which does not exist on the device, so it
  fell back to "no config": no cache directory and a rescan of every file under /usr/share/fonts
  (1368 files, mostly X11 bitmap fonts) on every start, blocking the UI for about 15 s before the
  first menu draw. Pointing it at this file keeps the same rule-free matching it had before, limits
  the scan to the TrueType fonts the OLED uses (Noto Sans, Noto Mono, icons.ttf = "View") and lets
  it keep a cache in /var/cache/fontconfig, so a start costs well under a second.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype</dir>
  <cachedir>/var/cache/fontconfig</cachedir>
</fontconfig>
